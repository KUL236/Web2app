plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// ── Build inputs (passed by the GitHub Actions workflow with -P flags) ────────
def prop = { String key, String fallback -> (project.findProperty(key) ?: fallback).toString() }
def javaString = { String s ->
    s.replace('\\', '\\\\').replace('"', '\\"').replace('\n', ' ').replace('\r', ' ')
}

def websiteUrl     = prop("websiteUrl", "https://web2appconversion.netlify.app/")
def appName        = prop("appName", "Web2App AI")
def appPackage     = prop("appPackage", "com.kul236.webapp")
def appVersionCode = prop("appVersionCode", "1").toInteger()
def appVersionName = prop("appVersionName", "1.0")
def buildId        = prop("buildId", "local")

android {
    // Fixed namespace (R / BuildConfig / Kotlin package) — independent from the
    // per-app applicationId, so every generated app can have its own package name.
    namespace 'com.web2app.template'
    compileSdk 34
    buildToolsVersion "34.0.0"

    defaultConfig {
        applicationId appPackage
        minSdk 26
        targetSdk 34
        versionCode appVersionCode
        versionName appVersionName

        buildConfigField "String", "WEBSITE_URL", "\"${javaString(websiteUrl)}\""
        buildConfigField "String", "APP_NAME", "\"${javaString(appName)}\""
        buildConfigField "String", "BUILD_ID", "\"${javaString(buildId)}\""

        vectorDrawables {
            useSupportLibrary true
        }
    }

    // NOTE: the release APK is built UNSIGNED here and signed afterwards in the
    // workflow with zipalign + apksigner. No signing config / env vars needed.
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            applicationIdSuffix ".debug"
            debuggable true
        }
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }

    packagingOptions {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.webkit:webkit:1.10.0'
    implementation 'androidx.activity:activity-ktx:1.8.2'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
    implementation 'androidx.core:core-splashscreen:1.0.1'
}
